# Config for the agent-owned tmux server.
#
# Always started as:
#   tmux -S ~/.tmux/sockets/agent.sock -f <this file> ...
#
# The whole point is that nothing here depends on the user's ~/.tmux.conf.
# Options are set at server birth because some of them (history-limit) only
# apply to panes created afterwards.
#
# Requires tmux >= 3.4 (default-size / window-size need 2.9, pane_dead_signal 3.4).

# --- durability: output survives the process exiting -----------------------
set  -g history-limit 10000
setw -g remain-on-exit on

# --- stable identity: a window named "dev" stays named "dev" ---------------
setw -g automatic-rename off
setw -g allow-rename off

# --- stable geometry: captures must not reflow when a human attaches -------
set  -g default-size 200x50
setw -g window-size manual
setw -g aggressive-resize off

# --- visibility for the human ---------------------------------------------
setw -g monitor-activity on
set  -g visual-activity off
set  -g visual-bell off
set  -g status-left '[#S] '

# --- predictable terminal for capture-pane --------------------------------
set  -g default-terminal 'tmux-256color'
set  -g set-titles off

# --- process environment, inherited by every pane -------------------------
# Python's new REPL emits cursor/bracket escapes that corrupt capture-pane.
set-environment -g PYTHON_BASIC_REPL 1
